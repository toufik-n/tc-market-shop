<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ver tienda en TC MARKET SHOP" />
  <title>Tienda — TC MARKET SHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<nav class="navbar">
  <div class="container">
    <a href="index.html" class="navbar-logo"><div class="logo-icon"><i class="fas fa-store"></i></div>TC MARKET</a>
    <div class="navbar-search" id="navbar-search-wrap">
      <i class="fas fa-search search-icon"></i>
      <input type="search" id="navbar-search" placeholder="Buscar..." aria-label="Buscar" />
    </div>
    <div class="navbar-actions">
      <a href="cart.html" class="nav-icon-btn"><i class="fas fa-shopping-cart"></i><span class="badge cart-badge" style="display:none">0</span></a>
      <div id="nav-guest" style="display:none;gap:.75rem;align-items:center">
        <a href="login.html" class="btn-nav btn-nav-outline">Entrar</a>
        <a href="register.html" class="btn-nav btn-nav-fill">Registrarse</a>
      </div>
      <div id="nav-user" class="user-menu" style="display:none">
        <div class="user-avatar" id="nav-avatar" data-dropdown-toggle="user-dropdown" role="button" tabindex="0"></div>
        <div class="dropdown-menu" id="user-dropdown">
          <a href="profile.html"><i class="fas fa-user"></i> Mi Perfil</a>
          <a href="orders.html"><i class="fas fa-box"></i> Mis Pedidos</a>
          <div class="divider"></div>
          <button data-action="logout"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
        </div>
      </div>
    </div>
  </div>
</nav>
<div id="mobile-overlay"></div>

<!-- Not found -->
<div id="store-not-found" style="display:none">
  <div class="empty-state" style="padding:6rem 2rem">
    <div class="empty-icon"><i class="fas fa-store"></i></div>
    <h3>Tienda no encontrada</h3>
    <p>Esta tienda no existe o ha sido eliminada.</p>
    <a href="explore.html" class="btn btn-primary">Explorar productos</a>
  </div>
</div>

<!-- Store content -->
<div id="store-content" style="display:none">
  <!-- Banner -->
  <div class="store-banner" id="store-banner">
    <img id="banner-img" alt="" style="width:100%;height:100%;object-fit:cover;display:none" />
  </div>

  <!-- Store info bar -->
  <div class="store-info-bar" style="background:var(--bg-white);border-bottom:1px solid var(--border-light)">
    <div class="store-logo-lg" id="store-logo">
      <i class="fas fa-store" style="color:#ccc"></i>
    </div>
    <div style="padding-top:var(--space-5)">
      <h1 id="store-name" style="font-size:1.5rem;margin-bottom:.3rem"></h1>
      <div style="display:flex;gap:1rem;flex-wrap:wrap;font-size:.875rem;color:var(--text-muted)">
        <span id="store-category-tag"></span>
        <span><i class="fas fa-star" style="color:#FDCB6E"></i> <strong id="store-rating"></strong> valoración</span>
        <span><i class="fas fa-box"></i> <strong id="store-products-count"></strong> productos</span>
        <span><i class="fas fa-shopping-bag"></i> <strong id="store-sales"></strong> ventas</span>
        <span><i class="fas fa-calendar"></i> Activa desde <strong id="store-since"></strong></span>
      </div>
    </div>
    <div style="margin-left:auto;padding-top:var(--space-5)">
      <button class="btn btn-outline" id="follow-btn">
        <i class="far fa-heart"></i> Seguir tienda
      </button>
    </div>
  </div>

  <!-- Store description + search -->
  <div style="max-width:1200px;margin:0 auto;padding:var(--space-6)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-6);flex-wrap:wrap;gap:1rem">
      <p id="store-description" style="max-width:600px;margin:0"></p>
      <div style="position:relative">
        <i class="fas fa-search" style="position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--text-muted)"></i>
        <input type="search" id="store-search" class="form-control" placeholder="Buscar en esta tienda..." style="padding-left:2.5rem;width:260px" />
      </div>
    </div>

    <!-- Products grid -->
    <div class="search-results-bar">
      <div class="results-count"><strong id="store-prod-count">0</strong> productos</div>
      <select id="store-sort" class="form-control" style="width:auto;font-size:.875rem;padding:.4rem .8rem;height:auto">
        <option value="relevance">Relevancia</option>
        <option value="price_asc">Precio ascendente</option>
        <option value="price_desc">Precio descendente</option>
        <option value="rating">Mejor valorados</option>
        <option value="newest">Más recientes</option>
      </select>
    </div>

    <div class="grid-4 stagger-children" id="store-products-grid"></div>

    <div id="store-no-products" style="display:none">
      <div class="empty-state">
        <div class="empty-icon"><i class="fas fa-box-open"></i></div>
        <h3>Esta tienda no tiene productos</h3>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="footer" style="margin-top:4rem">
  <div class="container">
    <div class="footer-bottom">
      <p>© 2024 TC MARKET SHOP</p>
    </div>
  </div>
</footer>

<div id="toast-container" class="toast-container" aria-live="polite"></div>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/store.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
<script>
let currentStore = null;
let storeProducts = [];

document.addEventListener('DOMContentLoaded', () => {
  const params = TCSearch.getSearchParams();
  const storeId = params.id || params.slug;
  if (!storeId) { document.getElementById('store-not-found').style.display = 'block'; return; }

  const store = TCStore.getStoreById(storeId) || TCStore.getStoreBySlug(storeId);
  if (!store) { document.getElementById('store-not-found').style.display = 'block'; return; }

  currentStore  = store;
  storeProducts = TCProducts.getProductsByStore(store.id);
  renderStore(store);
  renderProducts(storeProducts);

  // Follow button
  document.getElementById('follow-btn').addEventListener('click', function() {
    this.innerHTML = '<i class="fas fa-heart" style="color:var(--secondary)"></i> Siguiendo';
    TCUtils.showToast('¡Ahora sigues a ' + store.name + '!', 'success');
  });

  // Store search
  const dSearch = TCUtils.debounce(() => {
    const q = document.getElementById('store-search').value.trim();
    const filtered = storeProducts.filter(p =>
      p.name.toLowerCase().includes(q.toLowerCase()) ||
      p.description.toLowerCase().includes(q.toLowerCase())
    );
    renderProducts(filtered);
  }, 300);
  document.getElementById('store-search').addEventListener('input', dSearch);

  // Sort
  document.getElementById('store-sort').addEventListener('change', (e) => {
    const sorted = TCProducts.searchProducts('', { sort: e.target.value, storeId: store.id });
    renderProducts(sorted);
  });
});

function renderStore(store) {
  document.title = `${store.name} — TC MARKET SHOP`;
  document.getElementById('store-content').style.display = 'block';

  const bannerEl = document.getElementById('store-banner');
  bannerEl.style.background = `linear-gradient(135deg, ${store.color || '#6C63FF'}, #888)`;
  if (store.banner) {
    const img = document.getElementById('banner-img');
    img.src = store.banner;
    img.style.display = 'block';
  }

  const logoEl = document.getElementById('store-logo');
  if (store.logo) {
    logoEl.innerHTML = `<img src="${store.logo}" alt="${store.name}" style="width:100%;height:100%;object-fit:cover">`;
  }
  logoEl.style.background = store.color;

  document.getElementById('store-name').textContent        = store.name;
  document.getElementById('store-description').textContent = store.description;
  document.getElementById('store-category-tag').innerHTML  = `<span class="tag tag-primary">${store.category}</span>`;
  document.getElementById('store-rating').textContent      = store.rating || '—';
  document.getElementById('store-products-count').textContent = store.totalProducts || 0;
  document.getElementById('store-sales').textContent       = store.totalSales || 0;
  document.getElementById('store-since').textContent       = TCUtils.formatDate(store.createdAt, { month: 'long', year: 'numeric' });
}

function renderProducts(products) {
  const grid = document.getElementById('store-products-grid');
  const noEl = document.getElementById('store-no-products');
  document.getElementById('store-prod-count').textContent = products.length;

  if (!products.length) {
    grid.innerHTML = '';
    noEl.style.display = 'block';
    return;
  }
  noEl.style.display = 'none';

  grid.innerHTML = products.map(p => {
    const price    = TCProducts.getEffectivePrice(p);
    const discount = TCProducts.getDiscount(p);
    return `
      <div class="product-card">
        <div class="product-card-img-wrap">
          <img src="${p.image}" alt="${p.name}" class="product-card-image" loading="lazy" />
          ${discount ? `<div class="product-card-tag"><span class="tag tag-sale">-${discount}%</span></div>` : ''}
          <div class="product-card-actions">
            <button class="product-card-action-btn" onclick="addCart('${p.id}')" aria-label="Añadir"><i class="fas fa-shopping-cart"></i></button>
            <a href="product-detail.html?id=${p.id}" class="product-card-action-btn" aria-label="Ver"><i class="fas fa-eye"></i></a>
          </div>
        </div>
        <div class="product-card-body">
          <div class="product-card-category">${p.category}</div>
          <h3 class="product-card-name"><a href="product-detail.html?id=${p.id}">${p.name}</a></h3>
          <div class="product-card-price">
            <span class="price-current">${TCUtils.formatCurrency(price)}</span>
            ${p.salePrice ? `<span class="price-original">${TCUtils.formatCurrency(p.price)}</span>` : ''}
          </div>
          <div class="rating">${TCUtils.renderStars(p.rating)}<span class="count">(${p.reviews})</span></div>
        </div>
        <div class="product-card-footer">
          <button class="btn btn-primary btn-sm btn-block" onclick="addCart('${p.id}')"><i class="fas fa-cart-plus"></i> Añadir</button>
        </div>
      </div>
    `;
  }).join('');
}

function addCart(productId) {
  const res = TCCart.addToCart(productId, 1);
  if (res.success) TCUtils.showToast('Añadido al carrito', 'success');
  else TCUtils.showToast(res.message, 'error');
}
</script>
</body>
</html>
