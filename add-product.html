<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Añade productos a tu tienda en TC MARKET SHOP" />
  <title>Añadir Producto — TC MARKET SHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<nav class="navbar">
  <div class="container">
    <a href="index.html" class="navbar-logo"><div class="logo-icon"><i class="fas fa-store"></i></div>TC MARKET</a>
    <div class="navbar-search" id="navbar-search-wrap">
      <i class="fas fa-search search-icon"></i>
      <input type="search" id="navbar-search" placeholder="Buscar..." aria-label="Buscar" />
    </div>
    <div class="navbar-actions">
      <a href="cart.html" class="nav-icon-btn"><i class="fas fa-shopping-cart"></i><span class="badge cart-badge" style="display:none">0</span></a>
      <div id="nav-guest" style="display:none;gap:.75rem;align-items:center"><a href="login.html" class="btn-nav btn-nav-outline">Entrar</a></div>
      <div id="nav-user" class="user-menu" style="display:none">
        <div class="user-avatar" id="nav-avatar" data-dropdown-toggle="user-dropdown" role="button" tabindex="0"></div>
        <div class="dropdown-menu" id="user-dropdown">
          <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
          <a href="profile.html"><i class="fas fa-user"></i> Perfil</a>
          <div class="divider"></div>
          <button data-action="logout"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
        </div>
      </div>
    </div>
  </div>
</nav>
<div id="mobile-overlay"></div>

<div class="sidebar-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">Principal</div>
    <a href="dashboard.html" class="sidebar-nav-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
    <a href="my-store.html" class="sidebar-nav-item"><i class="fas fa-store"></i> Mi Tienda</a>
    <a href="add-product.html" class="sidebar-nav-item active"><i class="fas fa-box-open"></i> Productos</a>
    <a href="orders.html" class="sidebar-nav-item"><i class="fas fa-clipboard-list"></i> Pedidos</a>
    <div class="sidebar-title" style="margin-top:1rem">Cuenta</div>
    <a href="profile.html" class="sidebar-nav-item"><i class="fas fa-user"></i> Perfil</a>
  </aside>

  <main class="sidebar-content">
    <nav class="breadcrumbs">
      <a href="dashboard.html">Dashboard</a>
      <span class="separator">/</span>
      <span class="current">Productos</span>
    </nav>
    <div class="page-header animate-fade-up">
      <h1>Gestionar Productos</h1>
      <p>Añade y gestiona los productos de tu tienda</p>
    </div>

    <div class="grid-2" style="gap:var(--space-8);align-items:start">
      <!-- Add product form -->
      <div class="card animate-fade-up">
        <div class="card-header">
          <h3 id="form-title"><i class="fas fa-plus" style="color:var(--primary)"></i> Nuevo producto</h3>
        </div>
        <div class="card-body">
          <form id="product-form" novalidate>
            <input type="hidden" id="edit-product-id" />

            <div class="form-group">
              <label class="form-label">Nombre del producto *</label>
              <input type="text" id="prod-name" class="form-control" placeholder="Ej: Zapatillas Nike Air Max" required />
              <div class="invalid-feedback form-feedback" id="name-error"></div>
            </div>

            <div class="form-group">
              <label class="form-label">Descripción</label>
              <textarea id="prod-desc" class="form-control" rows="3" placeholder="Descripción detallada del producto..."></textarea>
            </div>

            <div class="grid-2">
              <div class="form-group">
                <label class="form-label">Precio (€) *</label>
                <div style="position:relative">
                  <span style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-muted)">€</span>
                  <input type="number" id="prod-price" class="form-control" placeholder="0.00" min="0.01" step="0.01" style="padding-left:2rem" required />
                </div>
                <div class="invalid-feedback form-feedback" id="price-error"></div>
              </div>
              <div class="form-group">
                <label class="form-label">Precio oferta (€)</label>
                <div style="position:relative">
                  <span style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-muted)">€</span>
                  <input type="number" id="prod-sale-price" class="form-control" placeholder="0.00" min="0" step="0.01" style="padding-left:2rem" />
                </div>
              </div>
            </div>

            <div class="grid-2">
              <div class="form-group">
                <label class="form-label">Categoría</label>
                <select id="prod-category" class="form-control">
                  <option value="Electrónica">Electrónica</option>
                  <option value="Moda">Moda</option>
                  <option value="Hogar">Hogar</option>
                  <option value="Deportes">Deportes</option>
                  <option value="Libros">Libros</option>
                  <option value="Juguetes">Juguetes</option>
                  <option value="Alimentación">Alimentación</option>
                  <option value="Belleza">Belleza</option>
                  <option value="General">General</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Stock</label>
                <input type="number" id="prod-stock" class="form-control" value="1" min="0" />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">URL de imagen principal</label>
              <input type="url" id="prod-image" class="form-control" placeholder="https://ejemplo.com/imagen.jpg" />
            </div>

            <!-- Preview image -->
            <div id="img-preview-box" style="display:none;margin-bottom:1rem">
              <img id="img-preview" alt="Vista previa" style="width:100%;height:160px;object-fit:cover;border-radius:var(--radius-md);border:1px solid var(--border)" />
            </div>

            <div class="form-group">
              <label class="form-label">Etiquetas (separadas por coma)</label>
              <input type="text" id="prod-tags" class="form-control" placeholder="Ej: ropa, verano, casual" />
            </div>

            <label class="form-check" style="margin-bottom:1rem">
              <input type="checkbox" class="form-check-input" id="prod-featured" />
              <span class="form-check-label"><i class="fas fa-star" style="color:#FDCB6E"></i> Marcar como destacado</span>
            </label>

            <div style="display:flex;gap:.75rem">
              <button type="button" class="btn btn-ghost" id="cancel-edit-btn" style="display:none">Cancelar</button>
              <button type="submit" class="btn btn-primary btn-block" id="submit-prod-btn">
                <i class="fas fa-plus"></i> <span id="submit-prod-text">Añadir producto</span>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Product preview -->
      <div style="position:sticky;top:calc(var(--navbar-h) + 1.5rem)">
        <div class="card animate-fade-up delay-200">
          <div class="card-header">
            <h3><i class="fas fa-eye" style="color:var(--accent)"></i> Vista previa</h3>
          </div>
          <div class="card-body" id="product-preview">
            <div class="product-card" style="max-width:100%">
              <div class="product-card-img-wrap">
                <img id="pv-image" src="https://picsum.photos/seed/preview/500/500" alt="Vista previa" class="product-card-image" />
              </div>
              <div class="product-card-body">
                <div class="product-card-category" id="pv-category">Categoría</div>
                <h3 class="product-card-name" id="pv-name">Nombre del producto</h3>
                <div class="product-card-price">
                  <span class="price-current" id="pv-price">€0,00</span>
                  <span class="price-original" id="pv-orig" style="display:none"></span>
                  <span class="price-badge" id="pv-discount" style="display:none"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Products list -->
    <div class="card animate-fade-up" style="margin-top:var(--space-8)">
      <div class="card-header">
        <h3>Mis productos</h3>
        <span class="tag tag-primary" id="products-count">0 productos</span>
      </div>
      <div id="products-list" style="padding:var(--space-4)"></div>
    </div>
  </main>
</div>

<div id="toast-container" class="toast-container" aria-live="polite"></div>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/store.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (!TCAuth.requireAuth()) return;

  // Live preview
  const nameIn  = document.getElementById('prod-name');
  const priceIn = document.getElementById('prod-price');
  const saleIn  = document.getElementById('prod-sale-price');
  const catIn   = document.getElementById('prod-category');
  const imgIn   = document.getElementById('prod-image');

  nameIn.addEventListener('input',  () => document.getElementById('pv-name').textContent   = nameIn.value || 'Nombre del producto');
  catIn.addEventListener('change',  () => document.getElementById('pv-category').textContent = catIn.value);
  priceIn.addEventListener('input', updatePreviewPrice);
  saleIn.addEventListener('input',  updatePreviewPrice);
  imgIn.addEventListener('input', () => {
    if (imgIn.value) {
      document.getElementById('pv-image').src = imgIn.value;
      document.getElementById('img-preview').src = imgIn.value;
      document.getElementById('img-preview-box').style.display = 'block';
    } else {
      document.getElementById('img-preview-box').style.display = 'none';
    }
  });

  function updatePreviewPrice() {
    const p = parseFloat(priceIn.value) || 0;
    const s = parseFloat(saleIn.value) || 0;
    document.getElementById('pv-price').textContent = TCUtils.formatCurrency(s > 0 && s < p ? s : p);
    const origEl = document.getElementById('pv-orig');
    const discEl = document.getElementById('pv-discount');
    if (s > 0 && s < p) {
      origEl.textContent = TCUtils.formatCurrency(p);
      origEl.style.display = 'inline';
      discEl.textContent = `-${Math.round((1 - s/p)*100)}%`;
      discEl.style.display = 'inline';
    } else {
      origEl.style.display = 'none';
      discEl.style.display = 'none';
    }
  }

  loadProductsList();

  // Form submit
  document.getElementById('product-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const editId = document.getElementById('edit-product-id').value;
    const data = {
      name: nameIn.value.trim(),
      description: document.getElementById('prod-desc').value.trim(),
      price: document.getElementById('prod-price').value,
      salePrice: document.getElementById('prod-sale-price').value || null,
      category: catIn.value,
      stock: document.getElementById('prod-stock').value,
      image: imgIn.value.trim(),
      tags: document.getElementById('prod-tags').value.split(',').map(t => t.trim()).filter(Boolean),
      featured: document.getElementById('prod-featured').checked,
    };

    // Validate
    if (!data.name) { document.getElementById('name-error').textContent = 'El nombre es obligatorio.'; return; }
    if (!data.price || parseFloat(data.price) <= 0) { document.getElementById('price-error').textContent = 'El precio debe ser mayor que 0.'; return; }

    const btn = document.getElementById('submit-prod-btn');
    btn.disabled = true;
    await new Promise(r => setTimeout(r, 400));

    let res;
    if (editId) {
      res = TCProducts.updateProduct(editId, data);
    } else {
      res = TCProducts.addProduct(data);
    }

    if (res.success) {
      TCUtils.showToast(editId ? 'Producto actualizado' : 'Producto añadido con éxito', 'success');
      resetForm();
      loadProductsList();
    } else {
      TCUtils.showToast(res.message, 'error');
    }
    btn.disabled = false;
  });

  document.getElementById('cancel-edit-btn').addEventListener('click', resetForm);
});

function resetForm() {
  document.getElementById('product-form').reset();
  document.getElementById('edit-product-id').value = '';
  document.getElementById('form-title').innerHTML = '<i class="fas fa-plus" style="color:var(--primary)"></i> Nuevo producto';
  document.getElementById('submit-prod-text').textContent = 'Añadir producto';
  document.getElementById('cancel-edit-btn').style.display = 'none';
  document.getElementById('img-preview-box').style.display = 'none';
  document.getElementById('pv-name').textContent   = 'Nombre del producto';
  document.getElementById('pv-price').textContent  = '€0,00';
  document.getElementById('pv-category').textContent = 'Categoría';
  document.getElementById('pv-image').src = 'https://picsum.photos/seed/preview/500/500';
}

function loadProductsList() {
  const user = TCAuth.getCurrentUser();
  const stores = TCStore.getStoresByUser(user.id);
  const list = document.getElementById('products-list');
  const countEl = document.getElementById('products-count');

  if (!stores.length) {
    list.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:1rem">Crea una tienda primero.</p>';
    return;
  }

  const products = TCProducts.getProductsByStore(stores[0].id);
  countEl.textContent = `${products.length} producto${products.length !== 1 ? 's' : ''}`;

  if (!products.length) {
    list.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:1rem">No tienes productos todavía.</p>';
    return;
  }

  list.innerHTML = products.map(p => `
    <div class="product-list-item" style="margin-bottom:.75rem">
      <img src="${p.image || 'https://picsum.photos/seed/default/80/80'}" alt="${p.name}" />
      <div class="product-list-info">
        <div class="cart-item-name">${p.name}</div>
        <div class="cart-item-store">${p.category} • Stock: ${p.stock}</div>
        <div style="display:flex;gap:.5rem;margin-top:.3rem">
          ${p.featured ? '<span class="tag tag-warning" style="font-size:.7rem">Destacado</span>' : ''}
          ${p.salePrice ? '<span class="tag tag-sale" style="font-size:.7rem">Oferta</span>' : ''}
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-weight:700">${TCUtils.formatCurrency(TCProducts.getEffectivePrice(p))}</div>
        ${p.salePrice ? `<div style="font-size:.75rem;text-decoration:line-through;color:var(--text-muted)">${TCUtils.formatCurrency(p.price)}</div>` : ''}
      </div>
      <div class="product-list-actions" style="flex-direction:column;gap:.5rem">
        <button class="btn btn-outline btn-sm" onclick="editProduct('${p.id}')"><i class="fas fa-edit"></i> Editar</button>
        <button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.id}')"><i class="fas fa-trash"></i></button>
      </div>
    </div>
  `).join('');
}

function editProduct(id) {
  const p = TCProducts.getProductById(id);
  if (!p) return;
  document.getElementById('edit-product-id').value = id;
  document.getElementById('prod-name').value       = p.name;
  document.getElementById('prod-desc').value       = p.description;
  document.getElementById('prod-price').value      = p.price;
  document.getElementById('prod-sale-price').value = p.salePrice || '';
  document.getElementById('prod-category').value   = p.category;
  document.getElementById('prod-stock').value      = p.stock;
  document.getElementById('prod-image').value      = p.image;
  document.getElementById('prod-tags').value       = (p.tags || []).join(', ');
  document.getElementById('prod-featured').checked = p.featured;
  document.getElementById('form-title').innerHTML = '<i class="fas fa-edit" style="color:var(--primary)"></i> Editar producto';
  document.getElementById('submit-prod-text').textContent = 'Guardar cambios';
  document.getElementById('cancel-edit-btn').style.display = 'inline-flex';
  if (p.image) { document.getElementById('img-preview').src = p.image; document.getElementById('img-preview-box').style.display = 'block'; }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function deleteProduct(id) {
  if (!confirm('¿Eliminar este producto?')) return;
  const res = TCProducts.deleteProduct(id);
  if (res.success) { TCUtils.showToast('Producto eliminado', 'info'); loadProductsList(); }
  else TCUtils.showToast(res.message, 'error');
}
</script>
</body>
</html>
