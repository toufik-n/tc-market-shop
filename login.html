<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Inicia sesión en TC MARKET SHOP" />
  <meta property="og:title" content="Iniciar Sesión — TC MARKET SHOP" />
  <title>Iniciar Sesión — TC MARKET SHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card animate-scale-in">
    <!-- Logo -->
    <div class="auth-logo">
      <a href="index.html" class="logo-mark" style="display:flex;width:56px;height:56px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:var(--radius-lg);align-items:center;justify-content:center;font-size:1.5rem;color:#fff;margin:0 auto var(--space-3)">
        <i class="fas fa-store"></i>
      </a>
      <h2>¡Bienvenido de nuevo!</h2>
      <p>Inicia sesión en tu cuenta</p>
    </div>

    <!-- Demo hint -->
    <div class="alert alert-info" style="font-size:.8rem">
      <i class="fas fa-info-circle"></i>
      <div>Demo: <strong>demo@tcmarket.com</strong> / <strong>demo123</strong></div>
    </div>

    <!-- Form -->
    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico</label>
        <div style="position:relative">
          <i class="fas fa-envelope" style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-muted)"></i>
          <input type="email" id="email" name="email" class="form-control" placeholder="tu@correo.com" style="padding-left:2.8rem" required autocomplete="email" />
        </div>
        <div class="invalid-feedback form-feedback" id="email-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <div style="position:relative">
          <i class="fas fa-lock" style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-muted)"></i>
          <input type="password" id="password" name="password" class="form-control" placeholder="Tu contraseña" style="padding-left:2.8rem;padding-right:3rem" required autocomplete="current-password" />
          <button type="button" id="toggle-pwd" style="position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer" aria-label="Ver contraseña">
            <i class="fas fa-eye" id="pwd-icon"></i>
          </button>
        </div>
        <div class="invalid-feedback form-feedback" id="password-error"></div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-5)">
        <label class="form-check" style="margin:0">
          <input type="checkbox" class="form-check-input" id="remember" />
          <span class="form-check-label">Recordarme</span>
        </label>
        <a href="#" class="link-primary" style="font-size:.875rem">¿Olvidaste tu contraseña?</a>
      </div>

      <div id="form-error" class="alert alert-danger" style="display:none">
        <i class="fas fa-exclamation-circle"></i>
        <div id="form-error-msg"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">
        <span id="submit-text">Iniciar sesión</span>
        <span id="submit-loader" style="display:none"><i class="fas fa-spinner fa-spin"></i></span>
      </button>
    </form>

    <div class="divider"></div>
    <p style="text-align:center;font-size:.9rem;color:var(--text-muted)">
      ¿No tienes cuenta? <a href="register.html" class="link-primary">Regístrate gratis</a>
    </p>
    <p style="text-align:center;margin-top:.5rem">
      <a href="index.html" class="link-primary" style="font-size:.85rem"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
    </p>
  </div>
</div>

<div id="toast-container" class="toast-container" aria-live="polite"></div>

<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/store.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  TCAuth.redirectIfLoggedIn('dashboard.html');

  // Toggle password visibility
  const toggleBtn = document.getElementById('toggle-pwd');
  const pwdInput  = document.getElementById('password');
  const pwdIcon   = document.getElementById('pwd-icon');
  toggleBtn.addEventListener('click', () => {
    const show = pwdInput.type === 'password';
    pwdInput.type = show ? 'text' : 'password';
    pwdIcon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
  });

  // Form submit
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;
    const errorDiv = document.getElementById('form-error');
    const errorMsg = document.getElementById('form-error-msg');

    // Clear errors
    errorDiv.style.display = 'none';
    document.querySelectorAll('.form-control').forEach(el => el.classList.remove('is-invalid'));

    let hasError = false;
    if (!TCUtils.isValidEmail(email)) {
      document.getElementById('email').classList.add('is-invalid');
      document.getElementById('email-error').textContent = 'Introduce un correo válido.';
      hasError = true;
    }
    if (!password) {
      document.getElementById('password').classList.add('is-invalid');
      document.getElementById('password-error').textContent = 'La contraseña es obligatoria.';
      hasError = true;
    }
    if (hasError) return;

    // Show loader
    document.getElementById('submit-text').style.display = 'none';
    document.getElementById('submit-loader').style.display = 'inline-block';
    document.getElementById('submit-btn').disabled = true;

    // Simulate async
    await new Promise(r => setTimeout(r, 600));

    const result = TCAuth.login(email, password, remember);

    if (result.success) {
      TCUtils.showToast('¡Bienvenido de nuevo!', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 800);
    } else {
      errorMsg.textContent = result.message;
      errorDiv.style.display = 'flex';
      document.getElementById('submit-text').style.display = 'inline-block';
      document.getElementById('submit-loader').style.display = 'none';
      document.getElementById('submit-btn').disabled = false;
    }
  });
});
</script>
</body>
</html>
